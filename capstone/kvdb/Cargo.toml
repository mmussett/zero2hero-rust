[package]
name = "kvdb"
version = "0.1.0"
edition = "2021"
description = "A persistent key-value store with an append-only log and TCP server"

[[bin]]
name = "kvdb"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror          = "1"
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
