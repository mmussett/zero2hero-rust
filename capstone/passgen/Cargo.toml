[package]
name = "passgen"
version = "0.1.0"
edition = "2021"
description = "An encrypted local password vault using Argon2 + AES-256-GCM"

[[bin]]
name = "passgen"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
argon2      = "0.5"
aes-gcm     = "0.10"
rand        = "0.8"
rpassword   = "7"
thiserror   = "1"
anyhow      = "1"
hex         = "0.4"
directories = "5"
