[package]
name = "img-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-based image processing compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image        = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
js-sys       = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
