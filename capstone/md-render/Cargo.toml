[package]
name = "md-render"
version = "0.1.0"
edition = "2021"
description = "Render Markdown to styled terminal output with ANSI colours"

[[bin]]
name = "md-render"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
crossterm     = "0.28"
thiserror     = "1"
anyhow        = "1"
