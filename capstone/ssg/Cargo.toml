[package]
name = "ssg"
version = "0.1.0"
edition = "2021"
description = "A command-line static site generator: Markdown + templates → HTML"

[[bin]]
name = "ssg"
path = "src/main.rs"

[dependencies]
clap           = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
minijinja      = "2"
walkdir        = "2"
thiserror      = "1"
anyhow         = "1"
chrono         = { version = "0.4", features = ["serde"] }
