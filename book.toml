[book]
title       = "Zero to Hero: Rust"
description = "A self-paced, project-based 30-day curriculum — from absolute beginner to production-minded Rust developer"
authors     = ["mmussett"]
language    = "en"
multilingual = false
src         = "."

[build]
build-dir = "book"

[output.html]
default-theme         = "rust"
preferred-dark-theme  = "coal"
git-repository-url    = "https://github.com/mmussett/zero2hero-rust"
edit-url-template     = "https://github.com/mmussett/zero2hero-rust/edit/main/{path}"
additional-css        = []
no-section-label      = false
